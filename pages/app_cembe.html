<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CEMBE</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            font-family: 'Helvetica', sans-serif;
        }

        .cembe-page {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url('../assets/favicon/cembebg.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .cembe-video-frame {
            position: fixed;
            bottom: 12%;
            right: 8%;
            width: min(320px, 42vw);
            aspect-ratio: 16 / 9;
            z-index: 25;
            border: 5px solid #ffcc00;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.8), 0 0 18px rgba(255, 204, 0, 0.42);
            animation: cembe-video-pulse 1.8s ease-in-out infinite;
            transform-origin: center;
        }

        .cembe-video-thumb {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: 8px;
            z-index: 1;
        }

        .cembe-video-thumb img {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cembe-video-link {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.56), rgba(0, 0, 0, 0.2));
            transition: background 0.2s ease;
        }

        .cembe-video-link:hover,
        .cembe-video-link:focus-visible {
            background: linear-gradient(to top, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.12));
            outline: none;
        }

        .cembe-play-badge {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.66);
            border: 4px solid #ffcc00;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.72), 0 0 16px rgba(255, 204, 0, 0.38);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.18s ease;
        }

        .cembe-play-badge::before {
            content: '';
            margin-left: 4px;
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            border-left: 20px solid #ffcc00;
        }

        .cembe-video-link:hover .cembe-play-badge,
        .cembe-video-link:focus-visible .cembe-play-badge {
            transform: scale(1.08);
        }

        @keyframes cembe-video-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.8), 0 0 18px rgba(255, 204, 0, 0.42);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.8), 0 0 26px rgba(255, 204, 0, 0.72);
            }
        }

        @media (max-width: 768px) {
            .cembe-video-frame {
                width: min(260px, 66vw);
                right: 6%;
                bottom: 14%;
            }

            .cembe-play-badge {
                width: 62px;
                height: 62px;
            }

            .cembe-play-badge::before {
                border-top-width: 11px;
                border-bottom-width: 11px;
                border-left-width: 17px;
            }
        }

        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 30;
            background: #ffcc00;
            color: #000;
            font-weight: 900;
            font-size: 15px;
            border: 4px solid #000;
            border-radius: 6px;
            box-shadow: 4px 4px 0 #000;
            padding: 10px 14px;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .back-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 #000;
        }

        .audio-status-indicator {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 52px;
            height: 52px;
            z-index: 32;
            user-select: none;
            border: 4px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.55);
            padding: 6px;
            cursor: pointer;
            transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
            box-shadow: 0 0 0 0 rgba(255, 204, 0, 0);
        }

        .audio-status-indicator:hover,
        .audio-status-indicator:focus-visible {
            transform: scale(1.08);
            border-color: rgba(255, 204, 0, 0.92);
            background: rgba(20, 20, 20, 0.8);
            box-shadow: 0 0 0 4px rgba(255, 204, 0, 0.18);
            outline: none;
        }

        .audio-status-indicator:active {
            transform: scale(1.02);
            border-color: rgba(255, 255, 255, 0.92);
        }

        .audio-status-indicator img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
        }

    </style>
</head>
<body>
    <div class="cembe-page" aria-label="Pantalla CEMBE"></div>

    <audio id="cembe-bg-music" preload="auto" loop>
        <source src="../assets/videos/pumpup.mp3" type="audio/mpeg">
    </audio>

    <div class="cembe-video-frame" aria-label="Video embebido en CEMBE">
        <div class="cembe-video-thumb" aria-hidden="true">
            <img src="https://drive.google.com/thumbnail?id=1ShkPB734Z47w6GLfdvlvwXnfze5Bu6F_&sz=w1200" alt="">
        </div>
        <a class="cembe-video-link" href="https://drive.google.com/file/d/1ShkPB734Z47w6GLfdvlvwXnfze5Bu6F_/view?usp=drivesdk" target="_blank" rel="noopener noreferrer" aria-label="Abrir video en Google Drive">
            <span class="cembe-play-badge" aria-hidden="true"></span>
        </a>
    </div>

    <button class="back-btn" id="back-btn" type="button" aria-label="Volver atrás">ATRAS</button>
    <button class="audio-status-indicator" id="audio-status-button" type="button" aria-label="Activar sonido" aria-pressed="false">
        <img id="audio-status-icon" src="../assets/favicon/vol-mute.png" alt="">
    </button>

    <script>
        const cembeBgMusic = document.getElementById('cembe-bg-music');
        const audioStatusButton = document.getElementById('audio-status-button');
        const audioStatusIcon = document.getElementById('audio-status-icon');

        const AUDIO_ICON_MUTE = '../assets/favicon/vol-mute.png';
        const AUDIO_ICON_PLAY = '../assets/favicon/vol-play.png';
        let audioMutedByUser = false;

        function isAudioElementPlaying(audioEl) {
            return !!audioEl && !audioEl.paused && !audioEl.ended && audioEl.readyState > 1;
        }

        function updateAudioStatusIcon() {
            if (!audioStatusIcon) return;

            const isPlaying = !audioMutedByUser && isAudioElementPlaying(cembeBgMusic);
            const nextIcon = isPlaying ? AUDIO_ICON_PLAY : AUDIO_ICON_MUTE;

            if (audioStatusIcon.getAttribute('src') !== nextIcon) {
                audioStatusIcon.setAttribute('src', nextIcon);
            }

            if (audioStatusButton) {
                audioStatusButton.setAttribute('aria-label', isPlaying ? 'Silenciar sonido' : 'Activar sonido');
                audioStatusButton.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
            }
        }

        function tryStartBackgroundMusic() {
            if (!cembeBgMusic || audioMutedByUser) return;
            cembeBgMusic.muted = false;
            cembeBgMusic.play().catch(() => {
                // Algunos navegadores bloquean autoplay sin interacción del usuario.
            });
        }

        function setAudioMutedState(shouldMute) {
            audioMutedByUser = shouldMute;
            cembeBgMusic.muted = shouldMute;

            if (shouldMute) {
                cembeBgMusic.pause();
                updateAudioStatusIcon();
                return;
            }

            tryStartBackgroundMusic();
            updateAudioStatusIcon();
        }

        function enableAudioOnFirstGesture() {
            if (audioMutedByUser) return;
            tryStartBackgroundMusic();
            window.removeEventListener('pointerdown', enableAudioOnFirstGesture);
            window.removeEventListener('touchstart', enableAudioOnFirstGesture);
            window.removeEventListener('keydown', enableAudioOnFirstGesture);
        }

        [cembeBgMusic].forEach((audioEl) => {
            if (!audioEl) return;
            audioEl.addEventListener('play', updateAudioStatusIcon);
            audioEl.addEventListener('playing', updateAudioStatusIcon);
            audioEl.addEventListener('pause', updateAudioStatusIcon);
            audioEl.addEventListener('ended', updateAudioStatusIcon);
            audioEl.addEventListener('emptied', updateAudioStatusIcon);
            audioEl.addEventListener('waiting', updateAudioStatusIcon);
        });

        if (audioStatusButton) {
            audioStatusButton.addEventListener('click', () => {
                setAudioMutedState(!audioMutedByUser);
            });
        }

        window.addEventListener('pointerdown', enableAudioOnFirstGesture, { passive: true });
        window.addEventListener('touchstart', enableAudioOnFirstGesture, { passive: true });
        window.addEventListener('keydown', enableAudioOnFirstGesture);

        tryStartBackgroundMusic();
        updateAudioStatusIcon();

        function resolveFallbackUrl() {
            const stored = sessionStorage.getItem('fb-cembe-return-url');
            return stored || '../index.html';
        }

        function goBackToPreviousPage() {
            const fallbackUrl = resolveFallbackUrl();
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            window.location.href = fallbackUrl;
        }

        document.getElementById('back-btn').addEventListener('click', goBackToPreviousPage);
    </script>
</body>
</html>
